<!DOCTYPE html>
<html>
    <head><title> Nested List</title></head>
    <body>
        <h3>Jenis Tumbuhan :</h3>
        <ol>
            <li>monokotil</li>
            <ol type="a">
                <li>kelapa</li>
                <li>padi</li>
            </ol>
            <li>dikotil</li>
            <ol type="i">
                <li>mangga</li>
                <li>jambu</li>
            </ol>
        </ol>
    </body>
</html>
