<!DOCTYPE html>
<html>
<head>
    <title>Form Login</title>
</head>
<body>
<p></p>

<form action="forminputtext.html">
    <fieldset>
        <legend>Form Login</legend>

        <label for="username">Username :</label>
        <input name="username" type="text" id="username" maxlength="25" />
    </p>

    <p>
        <label for="pass">Password :</label>
        <input name="pass" type="password" id="pass" maxlength="8" />
    </p>

    <p>
        <input type="submit" name="btn" id="button" value="Submit" />
        <input type="reset" name="btn" id="btn" value="Reset" />
    </p>
    </fieldset>
</form>

<p>&nbsp;</p>
</body>
</html>
