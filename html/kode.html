<!DOCTYPE html>
<html>
<head>
    <title>form dengan tabel</title>
<body>
    <h2>Form Biodata Peserta</h2>
    <form action="form2.html">
        <table width="323" height="191" border="0">
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td><input type="text" name="nama" id="nama" /></td>
            </tr>

            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>
                    <input type="radio" name="jk" id="radio" value="wanita" />
                    Wanita
                </td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>
                    <input type="radio" name="jk" id="radio2" value="Pria" />
                    <label for="jk">Pria</label>
                </td>
            </tr>

            <tr>
                <td>Hoby</td>
                <td>:</td>
                <td>
                    <input type="checkbox" name="hoby" id="hoby" />
                    Membaca
                </td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>
                    <input type="checkbox" name="hoby" id="hoby" />
                    Olahraga
                </td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>
                    <input type="checkbox" name="hoby" id="hoby" />
                    Musik
                </td>
            </tr>

            <tr>
                <td>Golongan darah</td>
                <td>:</td>
                <td>
                    <label for="goldarah"></label>
                    <select name="goldarah" id="goldarah">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="AB">AB</option>
                        <option value="O">O</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Alamat</td>
                <td>:</td>
                <td>
                    <label for="alamat"></label>
                    <textarea name="alamat" id="alamat" cols="45" rows="5"></textarea>
                </td>
            </tr>

            <tr>
                <td>&nbsp;</td>
                <td>&nbsp;</td>
                <td>
                    <input type="text" name="tombol" id="tombol" value="Submit" />
                    <input type="reset" name="tombol" id="tombol" value="Reset" />
                </td>
            </tr>
        </table>
    </form>

    <p>&nbsp;</p>
    <p>&nbsp;</p>
</body>
</head>
</html>
